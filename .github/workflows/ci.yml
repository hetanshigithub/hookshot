name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-h2:
    name: Tests (H2, PostgreSQL mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B verify

  test-postgres:
    name: Tests (real PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hookshot
          POSTGRES_PASSWORD: hookshot
          POSTGRES_DB: hookshot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hookshot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Spring maps these onto spring.datasource.*, overriding the H2 default in the test config.
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/hookshot
      SPRING_DATASOURCE_USERNAME: hookshot
      SPRING_DATASOURCE_PASSWORD: hookshot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Also runs ConcurrentClaimTest, which proves SKIP LOCKED hands each delivery to exactly one worker.
      - run: mvn -B verify

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [test-h2, test-postgres]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t hookshot .
